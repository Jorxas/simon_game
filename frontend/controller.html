<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game - Web Controller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/controller.css" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
    <div class="bubble-container"></div>

    <!-- Inactivity Warning -->
    <div id="inactivityWarning" class="alert alert-warning d-none">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <i class="fas fa-clock me-2"></i>
                <span>Connection timeout - Auto-disconnect in progress</span>
            </div>
            <button class="btn btn-sm btn-secondary" onclick="reconnect()">
                <i class="fas fa-sync me-2"></i>
                Reconnect
            </button>
        </div>
    </div>

    <!-- Header -->
    <nav class="navbar navbar-dark shadow-sm">
        <div class="container">
            <div class="d-flex align-items-center">
                <i class="fas fa-gamepad me-2" style="font-size: 32px; color: var(--simon-blue);"></i>
                <h1 class="navbar-brand mb-0 fs-3 fw-bold gradient-text">Web Controller</h1>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-success connection-indicator" id="connectionStatus">
                    <i class="fas fa-wifi me-1"></i>
                    Lobby #-
                </span>
                <span class="badge bg-primary">
                    <i class="fas fa-user me-1"></i>
                    <span id="playerName">Player #<span id="controllerId">-</span></span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Simon Game Section -->
        <div class="card game-card">
            <div class="card-header text-center">
                <h3 class="card-title">Simon Says</h3>
                <p class="card-text text-muted">
                    Round <span id="currentRound">1</span> - Follow the sequence!
                </p>
                <div class="d-flex justify-content-center gap-4 text-sm text-muted" id="gameInfo" style="display: none !important;">
                    <span>Sequence: <span id="gameSequence">red → blue → yellow</span></span>
                    <span>Your Progress: <span id="progress">0/1</span></span>
                </div>
            </div>
            <div class="card-body d-flex flex-column align-items-center">
                <!-- Simon Buttons Grid -->
                <div class="row g-3 mb-4">
                    <div class="col-6 d-flex justify-content-center">
                        <button class="simon-button simon-red" 
                                onclick="handleSimonClick('red')" id="redButton" data-color="0" disabled></button>
                    </div>
                    <div class="col-6 d-flex justify-content-center">
                        <button class="simon-button simon-yellow" 
                                onclick="handleSimonClick('yellow')" id="yellowButton" data-color="2" disabled></button>
                    </div>
                    <div class="col-6 d-flex justify-content-center">
                        <button class="simon-button simon-green" 
                                onclick="handleSimonClick('green')" id="greenButton" data-color="1" disabled></button>
                    </div>
                    <div class="col-6 d-flex justify-content-center">
                        <button class="simon-button simon-blue" 
                                onclick="handleSimonClick('blue')" id="blueButton" data-color="3" disabled></button>
                    </div>
                </div>

                <!-- Game Controls -->
                <div class="d-flex gap-3 mb-4">
                    <button class="btn btn-outline-warning" onclick="toggleReadyStatus()" id="readyButton">
                        <i class="fas fa-clock me-1"></i> Waiting
                    </button>
                </div>

                <!-- Game Progress -->
                <div class="w-100 mb-4 d-none" id="gameProgress">
                    <div class="d-flex justify-content-between text-sm mb-2">
                        <span>Round Progress</span>
                        <span id="roundProgress">0/1</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" role="progressbar" style="width: 0%" id="progressBar"></div>
                    </div>
                </div>

                <!-- Real-time Stats -->
                <div class="row g-3 w-100 text-center">
                    <div class="col-4">
                        <div class="p-3 bg-secondary bg-opacity-25 rounded">
                            <div class="small text-muted">Round</div>
                            <div class="fs-4 fw-bold text-primary" id="statRound">1</div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-3 bg-secondary bg-opacity-25 rounded">
                            <div class="small text-muted">Score</div>
                            <div class="fs-4 fw-bold text-primary" id="statScore">0</div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-3 bg-secondary bg-opacity-25 rounded">
                            <div class="small text-muted">Temps</div>
                            <div class="fs-4 fw-bold text-primary" id="statTime">00:00</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/controller.js"></script>
</body>
</html>
