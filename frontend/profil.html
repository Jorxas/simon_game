<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THM x Simon Game - Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --simon-blue: #3B82F6;
            --simon-green: #10B981;
            --simon-red: #EF4444;
            --simon-yellow: #F59E0B;
        }

        body {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
        }

        .gradient-text {
            background: linear-gradient(45deg, var(--simon-blue), var(--simon-green), var(--simon-red), var(--simon-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .avatar-option {
            width: 80px;
            height: 80px;
            border: 3px solid transparent;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .avatar-option:hover {
            transform: scale(1.1);
            border-color: var(--simon-blue);
        }

        .avatar-option.selected {
            border-color: var(--simon-green);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        .avatar-option img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .current-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: block;
            border: 4px solid var(--simon-blue);
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--simon-blue);
            color: white;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--simon-blue), #1E40AF);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #1E40AF, var(--simon-blue));
            transform: translateY(-2px);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-dark shadow-sm">
        <div class="container">
            <div class="d-flex align-items-center">
                <i class="fas fa-gamepad me-2" style="font-size: 32px; color: var(--simon-blue);"></i>
                <h1 class="navbar-brand mb-0 fs-3 fw-bold gradient-text">THM x Simon Game</h1>
            </div>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-light btn-sm" onclick="goToLobby()" title="Retour au Lobby">
                    <i class="fas fa-arrow-left"></i> Retour
                </button>
                <button class="btn btn-outline-light btn-sm" onclick="toggleTheme()" title="Toggle Theme" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card game-card">
                    <div class="card-header">
                        <h5 class="card-title d-flex align-items-center">
                            <i class="fas fa-user-edit me-2"></i>
                            Édition du Profil
                        </h5>
                        <p class="card-text text-muted">Modifiez votre mot de passe et votre photo de profil</p>
                    </div>
                    <div class="card-body">
                        <!-- Avatar actuel -->
                        <div class="text-center mb-4">
                            <img id="currentAvatar" class="current-avatar" src="/profil/avatar1.svg" alt="Avatar actuel">
                            <h6 class="text-white mt-2" id="currentUsername">Chargement...</h6>
                        </div>

                        <form id="profileForm">
                            <!-- Mot de passe actuel -->
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Mot de passe actuel</label>
                                <input type="password" class="form-control" id="currentPassword" required>
                            </div>

                            <!-- Nouveau mot de passe -->
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">Nouveau mot de passe (optionnel)</label>
                                <input type="password" class="form-control" id="newPassword" minlength="6">
                                <div class="form-text text-muted">Laissez vide si vous ne voulez pas changer le mot de passe</div>
                            </div>

                            <!-- Confirmation du nouveau mot de passe -->
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Confirmer le nouveau mot de passe</label>
                                <input type="password" class="form-control" id="confirmPassword">
                                <div class="form-text text-muted">Requis si vous changez le mot de passe</div>
                            </div>

                            <!-- Sélection de l'avatar -->
                            <div class="mb-4">
                                <label class="form-label">Choisir une photo de profil</label>
                                <div class="avatar-grid" id="avatarGrid">
                                    <!-- Les avatars seront générés par JavaScript -->
                                </div>
                            </div>

                            <!-- Boutons -->
                            <div class="d-flex gap-3">
                                <button type="submit" class="btn btn-primary flex-fill">
                                    <i class="fas fa-save me-2"></i>
                                    Sauvegarder
                                </button>
                                <button type="button" class="btn btn-outline-secondary" onclick="resetForm()">
                                    <i class="fas fa-undo me-2"></i>
                                    Réinitialiser
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast pour les notifications -->
    <div class="toast-container">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody">
                Message
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/profil.js"></script>
</body>
</html>
